# Template only — do not apply this file as-is, and never commit a copy of
# it with real values filled in. Generate the real Secret with
# k8s/create-secret.sh, which reads from your existing .env instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mts-foods
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  SECRET_KEY: "..."
  RAZORPAY_KEY_ID: "rzp_test_..."
  RAZORPAY_KEY_SECRET: "..."
  RAZORPAY_WEBHOOK_SECRET: "..."
  POSTGRES_PASSWORD: "..."
  # Must point at the in-cluster Postgres Service, not your local DB.
  DATABASE_URL: "postgresql+psycopg2://postgres:<POSTGRES_PASSWORD>@postgres:5432/mts_foods"
